<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행영어">
<meta name="theme-color" content="#ff7a45">
<title>엄마의 여행 영어</title>
<style>
:root{--bg:#fff8ef;--card:#fff;--ink:#2b2b2b;--sub:#777;--pri:#ff7a45;--pri2:#ffb37a;--ok:#2fb36b;--bad:#e5484d;--line:#f0e2d0;--blue:#3d7bfd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:20px;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
h1{font-size:26px;margin:4px 0 12px}
h2{font-size:22px;margin:8px 0 10px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--line)}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:16px;font-size:21px;font-weight:700;margin:10px 0;cursor:pointer;background:var(--pri);color:#fff;font-family:inherit}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.blue{background:var(--blue)}
.btn.ok{background:var(--ok)}
.btn.small{display:inline-block;width:auto;padding:10px 16px;font-size:18px;margin:4px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stats{display:flex;gap:8px;text-align:center}
.stat{flex:1;background:#fff;border-radius:16px;padding:10px 4px;border:1px solid var(--line)}
.stat b{display:block;font-size:24px}
.stat span{font-size:15px;color:var(--sub)}
.npc{display:flex;gap:12px;align-items:flex-start;margin:6px 0}
.ava{font-size:46px;line-height:1;flex:none;width:60px;height:60px;border-radius:50%;background:#ffe9d6;display:flex;align-items:center;justify-content:center}
.bubble{background:#fff;border:2px solid var(--line);border-radius:18px;border-top-left-radius:4px;padding:10px 14px;flex:1;cursor:pointer}
.bubble .en{font-weight:700}
.bubble .ko{color:var(--sub);font-size:17px}
.big-en{font-size:28px;font-weight:800;line-height:1.3;margin:6px 0}
.ko{color:#555}
.pron{color:var(--pri);font-size:17px}
.tag{display:inline-block;background:#ffe9d6;color:#c2541c;border-radius:10px;padding:2px 10px;font-size:15px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:20px;margin:8px 0;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt small{display:block;color:var(--sub);font-size:16px}
.opt.right{border-color:var(--ok);background:#e9f9ef}
.opt.wrong{border-color:var(--bad);background:#fdecec;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.play{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:50px;background:var(--blue);color:#fff;font-size:20px;font-weight:700;padding:12px 20px;margin:6px 4px 6px 0;cursor:pointer;font-family:inherit}
.play.slow{background:#7b8cff}
.prog{height:12px;background:#f1e4d4;border-radius:10px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:10px;transition:width .3s}
.top{display:flex;align-items:center;gap:10px}
.top .x{background:none;border:none;font-size:28px;cursor:pointer;color:var(--sub)}
.center{text-align:center}
.fb{border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:700}
.fb.ok{background:#e9f9ef;color:#17804a}
.fb.bad{background:#fdecec;color:#b42318}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;font-size:18px;font-family:inherit;color:var(--ink)}
.cat .e{font-size:34px;display:block}
.cat.done{border-color:var(--ok)}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.me{align-self:flex-end;background:var(--pri);color:#fff;border-radius:18px;border-top-right-radius:4px;padding:10px 14px;max-width:85%;font-weight:700}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.stamps div{aspect-ratio:1;border-radius:12px;background:#f6ece0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#aaa;flex-direction:column}
.stamps div.on{background:#ffe1cc;color:#c2541c;font-size:22px}
.stamps div.today{outline:2px solid var(--pri)}
.npcpick{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:12px;margin:8px 0;cursor:pointer;background:#fff}
.npcpick.sel{border-color:var(--pri);background:#fff3ea}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;font-size:17px;cursor:pointer;font-family:inherit}
.seg button.sel{border-color:var(--pri);background:#fff3ea;font-weight:700}
.list-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item .t{flex:1}
.mini{border:none;background:#eef2ff;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;flex:none}
.confetti{position:fixed;top:-40px;font-size:30px;animation:fall 2.6s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--pri);color:var(--pri)}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.hint{font-size:16px;color:var(--sub)}
.badge{display:inline-block;margin:4px;padding:6px 12px;border-radius:14px;background:#fff3c4;font-size:16px}
.badge.off{background:#eee;color:#bbb}
</style>
</head>
<body>
<div id="app"><div class="card" style="margin-top:40px;text-align:center">
<div style="font-size:60px">✈️</div><h2>엄마의 여행 영어</h2>
<p>이 화면이 계속 보이면<br>미리보기 창이라 실행이 안 되는 거예요.</p>
<p><b>'열기' → Safari(또는 크롬)</b>로<br>열어 주세요.</p></div></div>
<script>
// ===================== 데이터 =====================
// ===================== 데이터 (packs/*.json 에서 불러옴) =====================
let CATS=[],S={},R={},PACKS=[],MANIFEST=null;
function mergePack(p){const cats=[];(p.cats||[]).forEach(c=>{if(S[c.id])return;CATS.push({id:c.id,e:c.e,n:c.n,role:c.role,pack:p.id});S[c.id]=c.s;R[c.id]=c.r;cats.push(c.id)});
 PACKS.push({id:p.id,week:p.week,date:p.date,title:p.title,cats})}

const NPCS={
emily:{ava:'👩‍✈️',name:'에밀리',desc:'상냥한 승무원 · 또박또박 친절하게',pitch:1.25,
 hi:[["Hello! Let's practice together!","안녕하세요! 오늘도 같이 연습해요!"],["Ready for your trip?","여행 준비되셨어요?"],["You're doing great every day!","매일 정말 잘하고 계세요!"]],
 good:[["Perfect!","완벽해요!"],["Great job!","정말 잘하셨어요!"],["You sound like a local!","현지인 같아요!"],["Wonderful!","멋져요!"]],
 bad:[["That's okay!","괜찮아요, 다시 해봐요!"],["Almost there!","거의 다 왔어요!"],["No worries!","걱정 마세요, 천천히요!"]],
 huh:[["Sorry? I don't understand.","네? 무슨 말씀인지 잘 모르겠어요."],["Hmm, could you say that again?","음, 다시 말씀해 주시겠어요?"]],
 end:[["See you tomorrow!","내일 또 만나요!"],["You're ready to fly!","이제 비행기 타셔도 되겠어요!"]]},
tony:{ava:'🧔',name:'토니',desc:'뉴욕 택시기사 · 유쾌하고 장난꾸러기',pitch:0.9,
 hi:[["Hey there! Hop in!","어서 와요! 타세요!"],["What's up? Let's roll!","잘 지냈어요? 출발해볼까요!"]],
 good:[["Awesome!","끝내줘요!"],["You got it!","바로 그거예요!"],["Whoa, nice!","와, 대박!"],["Boom! Perfect!","빵! 완벽!"]],
 bad:[["Oops! Try again!","앗! 한 번 더!"],["Hmm, not quite.","음~ 살짝 아쉬워요"],["No problem, buddy!","괜찮아요, 친구!"]],
 huh:[["Huh? What was that?","엥? 뭐라고요?"],["Wait, what? I'm confused!","잠깐만요, 헷갈려요!"]],
 end:[["You rock! See ya!","최고예요! 또 봐요!"],["Same time tomorrow?","내일 이 시간에 또?"]]},
marie:{ava:'👩‍🍳',name:'마리',desc:'파리 카페 사장님 · 우아하고 다정하게',pitch:1.1,
 hi:[["Bonjour! Welcome to my cafe!","봉주르! 제 카페에 오신 걸 환영해요!"],["Hello, my friend!","안녕하세요, 친구!"]],
 good:[["Lovely!","사랑스러워요!"],["Very good!","아주 좋아요!"],["Beautiful English!","영어가 정말 아름다워요!"]],
 bad:[["Oh, almost!","어머, 거의 맞았어요!"],["Again, slowly.","천천히 다시 해봐요"],["It's okay, dear.","괜찮아요~"]],
 huh:[["Pardon? I'm confused.","네? 헷갈리네요."],["Sorry, what do you mean?","죄송해요, 무슨 뜻이에요?"]],
 end:[["See you soon, my friend!","곧 또 봐요, 친구!"],["Have a lovely evening!","좋은 저녁 보내세요!"]]},
david:{ava:'🤵',name:'데이비드',desc:'런던 호텔 지배인 · 차분한 신사',pitch:0.75,
 hi:[["Good day! Shall we begin?","좋은 하루입니다! 시작해 볼까요?"],["Welcome back!","다시 오신 걸 환영합니다!"]],
 good:[["Excellent!","훌륭합니다!"],["Splendid!","대단하십니다!"],["Very well done.","아주 잘하셨습니다"]],
 bad:[["Not to worry.","걱정 마십시오"],["Let's try once more.","한 번 더 해보시지요"]],
 huh:[["I beg your pardon?","실례지만, 다시 말씀해 주시겠어요?"],["I'm afraid I don't follow.","죄송하지만 이해를 못 했습니다."]],
 end:[["Splendid work today.","오늘 정말 훌륭하셨습니다."],["Until tomorrow!","내일 뵙겠습니다!"]]}};

const LEVELS=[[0,'🌱 여행 새내기'],[100,'🧳 짐 싸는 중'],[250,'✈️ 공항 통과'],[500,'🗺️ 길 찾기 달인'],[800,'🍝 맛집 주문왕'],[1200,'🛍️ 쇼핑 고수'],[1800,'🌍 세계 여행자'],[2600,'👑 영어 할머니 여왕']];
const INT=[0,1,2,4,7,15];
let ALL=[],BYID={};
function buildAll(){ALL=[];CATS.forEach(c=>S[c.id].forEach((s,i)=>ALL.push({id:c.id+i,cat:c.id,pack:c.pack,en:s[0],ko:s[1],pr:s[2],sit:s[3]})));BYID={};ALL.forEach(x=>BYID[x.id]=x)}

// ===================== 저장 =====================
const KEY='momEnglish_v1';
let st;
function load(){try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 st=Object.assign({npc:'emily',rate:0.8,hintKo:true,cards:{},xp:0,streak:0,lastDay:'',days:[],role:{},sessions:0},st||{})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
load();
const today=()=>new Date().toLocaleDateString('sv');
function addDays(d,n){const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.toLocaleDateString('sv')}

// ===================== 유틸 =====================
const $=s=>document.querySelector(s);
const app=$('#app');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const npc=()=>NPCS[st.npc]||NPCS.emily;
function level(){let l=LEVELS[0],n=null;for(let i=0;i<LEVELS.length;i++){if(st.xp>=LEVELS[i][0]){l=LEVELS[i];n=LEVELS[i+1]}}return{t:l[1],cur:l[0],next:n?n[0]:null}}

// 카톡 안에서 열면 외부 브라우저로 자동 전환 (카톡 내장 브라우저는 소리가 안 나는 경우가 많음)
(function(){const ua=navigator.userAgent||'';if(/KAKAOTALK/i.test(ua)&&!sessionStorageSafe()){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)}
 function sessionStorageSafe(){try{if(sessionStorage.getItem('kx'))return true;sessionStorage.setItem('kx','1')}catch(e){}return false}})();
const HAS_TTS=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
const IN_APP=/KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent||'');
// iOS/안드로이드는 첫 터치 때 음성을 '깨워야' 소리가 남
let unlocked=false;
function unlock(){if(unlocked||!HAS_TTS)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);try{speechSynthesis.resume()}catch(e){}}catch(e){}}
document.addEventListener('touchstart',unlock,{once:true,passive:true});document.addEventListener('click',unlock,{once:true});
// 음성 (TTS)
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
 voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google|Natural|Aria|Jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null}
try{if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function say(text,opt={}){if(!unlocked)unlock();if(opt.end){const f=opt.end;let done=false;opt.end=()=>{if(!done){done=true;f()}};setTimeout(opt.end,text.length*90+1800)}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;
 u.rate=opt.rate||st.rate;u.pitch=opt.pitch!=null?opt.pitch:npc().pitch;if(opt.end)u.onend=opt.end;speechSynthesis.speak(u);try{speechSynthesis.resume()}catch(e){}}catch(e){}}
function npcSay(line,el){if(el){el.innerHTML=`<div class="en">${esc(line[0])}</div><div class="ko">${esc(line[1])}</div>`;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}say(line[0],{rate:Math.min(1,st.rate+0.1)})}
function confetti(){const em=['🎉','⭐','✨','🌸','✈️','💖'];for(let i=0;i<24;i++){const d=document.createElement('div');d.className='confetti';d.textContent=rnd(em);d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*0.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
function npcBox(line,id='nb'){const n=npc();return `<div class="npc"><div class="ava">${n.ava}</div><div class="bubble pop" id="${id}"><div class="en">${esc(line[0])}</div><div class="ko">${esc(line[1])}</div></div></div>`}
function bindNpcBubble(id='nb'){const b=document.getElementById(id);if(b)b.onclick=()=>{const en=b.querySelector('.en');if(en)say(en.textContent,{rate:Math.min(1,st.rate+0.1)})}}

// 음성 인식 (지원 브라우저 + 마이크 허용 시에만, 아니면 스스로 평가)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function norm(t){return t.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean)}
function score(target,heard){const a=norm(target),b=new Set(norm(heard));if(!a.length)return 0;return a.filter(w=>b.has(w)).length/a.length}
function micHTML(){return SR?`<button class="btn blue" id="mic">🎤 말하고 확인받기</button><div id="heard"></div>`:''}
function bindMic(x,onPass){if(!SR)return;const btn=$('#mic');if(!btn)return;
 btn.onclick=()=>{let r;try{r=new SR()}catch(e){return}
  r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
  btn.disabled=true;btn.textContent='👂 듣고 있어요... 말씀하세요';try{speechSynthesis.cancel()}catch(e){}
  r.onresult=e=>{let best=0,txt='';for(const alt of e.results[0]){const sc=score(x.en,alt.transcript);if(sc>=best){best=sc;txt=alt.transcript}}
   const h=$('#heard');
   if(best>=0.6){h.innerHTML=`<div class="fb ok">👂 들린 말: "${esc(txt)}" — 아주 좋아요!</div>`;setTimeout(onPass,700)}
   else{h.innerHTML=`<div class="fb bad">👂 들린 말: "${esc(txt)}"<br><span style="font-weight:400">조금 달라요. 다시 해보거나 아래에서 스스로 평가해 주세요.</span></div>`}};
  r.onerror=e=>{$('#heard').innerHTML=`<div class="hint">마이크를 쓸 수 없어요${e.error==='not-allowed'?' (마이크 권한을 허용해 주세요)':''}. 아래 버튼으로 스스로 평가해 주세요.</div>`};
  r.onend=()=>{btn.disabled=false;btn.textContent='🎤 다시 말해보기'};
  try{r.start()}catch(e){btn.disabled=false}}}

// ===================== 홈 =====================
function stampedToday(){return st.days.includes(today())}
function home(){
 try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
 const lv=level(),n=npc();
 const due=ALL.filter(x=>st.cards[x.id]&&st.cards[x.id].due<=today()).length;
 const learned=Object.keys(st.cards).length;
 // 오늘의 한마디 (날짜 고정)
 const seed=today().split('-').join('')%ALL.length;const tip=ALL[seed];
 const greet=rnd(n.hi);
 const streakAlive=st.lastDay===today()||st.lastDay===addDays(today(),-1);
 const pct=lv.next?Math.round((st.xp-lv.cur)/(lv.next-lv.cur)*100):100;
 app.innerHTML=`
 <h1>엄마의 여행 영어 ✈️ <span id="vb" style="font-size:14px;vertical-align:middle;background:#ffe9d6;color:#c2541c;border-radius:10px;padding:3px 9px;cursor:pointer;font-weight:700">v${MANIFEST?esc(MANIFEST.version):'-'}${MANIFEST&&MANIFEST.notice&&st.seenNotice!==MANIFEST.notice.id?' 🔴':''}</span></h1>
 ${(!HAS_TTS||IN_APP)?`<div class="fb bad" style="font-weight:400">🔇 <b>이 화면에선 소리가 안 날 수 있어요.</b><br>오른쪽 아래(또는 위) <b>⋯ → 다른 브라우저로 열기</b>를 눌러 Safari·크롬으로 열어 주세요.</div>`:''}
 ${npcBox(greet)}
 <div class="stats">
  <div class="stat"><b>🔥 ${streakAlive?st.streak:0}</b><span>연속 출석</span></div>
  <div class="stat"><b>⭐ ${st.xp}</b><span>점수</span></div>
  <div class="stat"><b>📖 ${learned}</b><span>배운 문장/${ALL.length}</span></div>
 </div>
 <div class="card"><div style="display:flex;justify-content:space-between"><b>${lv.t}</b><span class="hint">${lv.next?'다음 등급까지 '+(lv.next-st.xp)+'점':'최고 등급!'}</span></div>
 <div class="prog"><i style="width:${pct}%"></i></div></div>
 ${stampedToday()
  ?`<div class="fb ok center">✅ 오늘 도장 받았어요! 내일 또 만나요</div><button class="btn sec" id="go">🔁 한 번 더 연습하기</button>`
  :`<button class="btn" id="go">▶ 오늘의 연습 시작<br><span style="font-size:16px;font-weight:400">10문장 · 약 10분 ${due?'(복습 '+Math.min(due,6)+'개 포함)':''}</span></button>`}
 ${latestPackBtn()}

// ===================== 오늘의 연습 =====================
let Q;
function startSession(focus){
 const t=today();
 const due=shuffle(ALL.filter(x=>st.cards[x.id]&&st.cards[x.id].due<=t)).slice(0,6);
 const pool=ALL.filter(x=>!st.cards[x.id]);const fp=focus?pool.filter(x=>x.pack===focus):[];
 const fresh=(fp.length?fp.concat(pool.filter(x=>x.pack!==focus)):pool).slice(0,10-due.length);
 let items=due.map(x=>({x,isNew:false}));
 fresh.forEach(x=>items.push({x,isNew:true}));
 if(items.length<10){ // 다 배웠으면 낮은 단계부터 추가 복습
  const extra=shuffle(ALL.filter(x=>!items.find(i=>i.x.id===x.id))).sort((a,b)=>(st.cards[a.id]?.box||0)-(st.cards[b.id]?.box||0)).slice(0,10-items.length);
  extra.forEach(x=>items.push({x,isNew:false}));
 }
 // 새 문장은 뒤쪽 섞기 (복습 먼저)
 Q={items,i:0,right:0,wrong:0,xp:0,retried:{}};
 nextCard();
}
function cardBox(id){return st.cards[id]?st.cards[id].box:0}
function header(){const p=Math.round(Q.i/Q.items.length*100);
 return `<div class="top"><button class="x" id="quit">✕</button><div class="prog" style="flex:1"><i style="width:${p}%"></i></div><span class="hint">${Math.min(Q.i+1,Q.items.length)}/${Q.items.length}</span></div>`}
function bindQuit(){$('#quit').onclick=()=>{if(Q.i>0)saveCards();home()}}
function saveCards(){save()}

function nextCard(){
 if(Q.i>=Q.items.length)return finish();
 const it=Q.items[Q.i];
 if(it.isNew&&!it.learned)return learnScreen(it);
 const box=cardBox(it.x.id);
 if(it.isNew||box===0)return qListen(it);
 if(box===1)return qBlank(it);
 if(box===2)return qRepeat(it);
 return qSpeak(it);
}
function playBtns(en){return `<button class="play" data-say="${esc(en)}">🔊 듣기</button><button class="play slow" data-slow="${esc(en)}">🐢 천천히</button>`}
function bindPlay(){app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,{pitch:1}));
 app.querySelectorAll('[data-slow]').forEach(b=>b.onclick=()=>say(b.dataset.slow,{rate:0.55,pitch:1}))}

// 0) 새 문장 배우기
function learnScreen(it){const x=it.x,c=CATS.find(c=>c.id===x.cat);
 app.innerHTML=header()+`
 <div class="card pop"><span class="tag">${c.e} ${c.n} · 새 문장</span>
 <div class="hint" style="margin-top:8px">상황: ${esc(x.sit)}</div>
 <div class="big-en">${esc(x.en)}</div><div class="ko" style="font-size:21px">${esc(x.ko)}</div><div class="pron">${esc(x.pr)}</div>
 <div>${playBtns(x.en)}</div></div>
 <div class="card hint">👄 소리를 듣고 <b>세 번 소리 내어</b> 따라 말해 보세요. 입으로 말해야 진짜 늘어요!</div>
 <div id="cnt" class="center" style="font-size:34px">⚪⚪⚪</div>
 <button class="btn sec" id="rep">🗣️ 따라 말했어요 (1번)</button>
 <button class="btn" id="ok">다음 → 문제 풀기</button>`;
 bindQuit();bindPlay();setTimeout(()=>say(x.en,{pitch:1}),300);
 let n=0;$('#rep').onclick=()=>{n=Math.min(3,n+1);$('#cnt').textContent='🟠'.repeat(n)+'⚪'.repeat(3-n);$('#rep').textContent=n<3?`🗣️ 따라 말했어요 (${n+1}번)`:'👏 세 번 다 했어요!';if(n<3)say(x.en,{pitch:1});else{Q.xp+=3;st.xp+=3}};
 $('#ok').onclick=()=>{it.learned=true;nextCard()};
}

// 공통 결과 처리
function result(it,correct,detailHTML){
 const n=npc(),line=correct?rnd(n.good):rnd(n.bad);
 const x=it.x,t=today();
 const firstTry=!Q.retried[x.id];
 let c=st.cards[x.id]||{box:0,due:t};
 if(firstTry){
  if(correct){c.box=Math.min(5,c.box+1);c.due=addDays(t,INT[c.box]);Q.right++;Q.xp+=10;st.xp+=10}
  else{c.box=Math.max(0,c.box-1);c.due=addDays(t,1);Q.wrong++;Q.xp+=2;st.xp+=2;
   Q.retried[x.id]=1;Q.items.push({x,isNew:false,retry:true})} // 틀린 문장은 마지막에 한 번 더
 }else if(correct){Q.xp+=5;st.xp+=5}
 st.cards[x.id]=c;save();
 const area=$('#res');
 area.innerHTML=`${npcBox(line,'rb')}
 <div class="fb ${correct?'ok':'bad'}">${correct?'⭕ 정답이에요!':'❌ 괜찮아요! 이 문장은 마지막에 한 번 더 나와요'}</div>
 <div class="card"><div class="big-en" style="font-size:23px">${esc(x.en)}</div><div class="ko">${esc(x.ko)}</div><div class="pron">${esc(x.pr)}</div>${detailHTML||''}<div>${playBtns(x.en)}</div></div>
 <button class="btn" id="nx">다음 ▶</button>`;
 bindNpcBubble('rb');bindPlay();
 npcSay(line);setTimeout(()=>say(x.en,{pitch:1}),1300);
 $('#nx').onclick=()=>{Q.i++;nextCard()};
 area.scrollIntoView({behavior:'smooth',block:'start'});
}

// 1) 듣고 뜻 고르기
function qListen(it){const x=it.x;
 const others=shuffle(ALL.filter(y=>y.id!==x.id&&y.cat===x.cat)).slice(0,1).concat(shuffle(ALL.filter(y=>y.cat!==x.cat)).slice(0,1));
 const opts=shuffle([x,...others]);
 app.innerHTML=header()+`
 <div class="card center"><span class="tag">👂 듣고 뜻 고르기</span>
 <div style="margin:14px 0">${playBtns(x.en)}</div><div class="hint">소리를 듣고 알맞은 뜻을 골라 주세요</div></div>
 <div id="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o.ko)}</button>`).join('')}</div><div id="res"></div>`;
 bindQuit();bindPlay();setTimeout(()=>say(x.en,{pitch:1}),300);
 app.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.id===x.id;
  app.querySelectorAll('#opts .opt').forEach(o=>{o.disabled=true;if(o.dataset.id===x.id)o.classList.add('right')});if(!ok)b.classList.add('wrong');result(it,ok)});

// 2) 빈칸 채우기
const STOP=new Set(['the','a','an','is','to','i','my','me','you','it','can','do','for','this','of','in','at','on','and','please','i\'m','it\'s','i\'d','i\'ll','with','be','us']);
function wordsOf(s){return s.replace(/[.,!?]/g,'').split(' ')}
function qBlank(it){const x=it.x;
 const ws=wordsOf(x.en);let cand=ws.filter(w=>!STOP.has(w.toLowerCase())&&w.length>=3);if(!cand.length)cand=ws;
 const target=cand.sort((a,b)=>b.length-a.length)[0];
 const pool=[...new Set(ALL.flatMap(y=>wordsOf(y.en)).filter(w=>w.length>=3&&!STOP.has(w.toLowerCase())&&w.toLowerCase()!==target.toLowerCase()))];
 const opts=shuffle([target,...shuffle(pool).slice(0,2)]);
 const shown=esc(x.en).replace(new RegExp('\\b'+target.replace(/[.*+?^${}()|[\]\\']/g,'\\$&')+'\\b'),'<span class="blank">&nbsp;?&nbsp;</span>');
 app.innerHTML=header()+`
 <div class="card"><span class="tag">✏️ 빈칸 채우기</span>
 <div class="ko" style="margin-top:10px;font-size:21px">${esc(x.ko)}</div>
 <div class="big-en" style="font-size:25px">${shown}</div>${playBtns(x.en)}</div>
 <div id="opts">${opts.map(o=>`<button class="opt" data-w="${esc(o)}" style="text-align:center;font-weight:700">${esc(o)}</button>`).join('')}</div><div id="res"></div>`;
 bindQuit();bindPlay();
 app.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.w===target;
  app.querySelectorAll('#opts .opt').forEach(o=>{o.disabled=true;if(o.dataset.w===target)o.classList.add('right')});if(!ok)b.classList.add('wrong');result(it,ok)});
}

  <button class="btn ok" id="y">⭕ 거의 맞았어요</button><button class="btn sec" id="n">❌ 달랐어요</button>`;bindPlay();

// 결과 화면
function finish(){
 const t=today(),n=npc();let newStamp=false;
 if(!st.days.includes(t)){newStamp=true;st.days.push(t);
  st.streak=(st.lastDay===addDays(t,-1))?st.streak+1:1;st.lastDay=t;st.xp+=20;Q.xp+=20}
 st.sessions++;save();
 const line=rnd(n.end);const total=Q.right+Q.wrong;const acc=total?Math.round(Q.right/total*100):100;
 const msg=acc>=90?'완벽한 하루! 🏆':acc>=70?'아주 잘하셨어요! 👏':'꾸준함이 최고예요! 💪';
 app.innerHTML=`<h1 class="center">${msg}</h1>
 ${npcBox(line)}
 ${newStamp?`<div class="card center pop"><div style="font-size:70px">💮</div><b>오늘의 도장 쾅!</b><div class="hint">🔥 ${st.streak}일 연속 출석 · 보너스 +20점</div></div>`:''}
 <div class="stats"><div class="stat"><b>${Q.right}</b><span>첫 번에 정답</span></div><div class="stat"><b>${acc}%</b><span>정답률</span></div><div class="stat"><b>+${Q.xp}</b><span>받은 점수</span></div></div>

 <button class="btn blue" id="rp">🎭 배운 걸로 상황극 해보기</button>
 <button class="btn sec" id="hm">🏠 처음으로</button>`;

function roleList(){const n=npc();
 app.innerHTML=`<div class="top"><button class="x" id="bk">←</button><h2 style="margin:0">🎭 상황극 대화</h2></div>
 ${npcBox([`Let's talk! Pick a place.`,`${n.name}가 상대역을 맡아요. 장소를 골라 주세요!`])}
 ${PACKS.slice().reverse().map(p=>`<h2 style="font-size:19px;margin-top:16px">${esc(p.title)}</h2><div class="grid">${p.cats.map(id=>CATS.find(c=>c.id===id)).map(c=>`<button class="cat ${st.role[c.id]?'done':''}" data-c="${c.id}"><span class="e">${c.e}</span>${esc(c.n)}<br><span class="hint">${st.role[c.id]?'✅ '+st.role[c.id]+'회 성공':esc(c.role)+' 역'}</span></button>`).join('')}</div>`).join('')}
 <div class="card hint">⚙️ 설정에서 대화 상대(에밀리·토니·마리·데이비드)와 한글 뜻 보기를 바꿀 수 있어요.</div>`;
 bindNpcBubble();$('#bk').onclick=home;

}
function rolePlay(cid){const c=CATS.find(x=>x.id===cid),n=npc(),turns=R[cid];let ti=0,miss=0;
 app.innerHTML=`<div class="top"><button class="x" id="bk">✕</button><b>${c.e} ${c.n} · ${n.name}(${c.role})</b></div>
 <div class="chat" id="chat"></div><div id="ctl"></div>`;
 $('#bk').onclick=roleList;
 const chat=$('#chat'),ctl=$('#ctl');
 function addNpc(en,ko,cls=''){const d=document.createElement('div');d.className='npc pop';
  d.innerHTML=`<div class="ava" style="width:48px;height:48px;font-size:34px">${n.ava}</div><div class="bubble ${cls}"><div class="en">${esc(en)}</div><div class="ko" ${st.hintKo?'':'style="display:none"'}>${esc(ko)}</div>${st.hintKo?'':'<div class="hint">👆 눌러서 다시 듣기 · 뜻 보기</div>'}</div>`;
  const b=d.querySelector('.bubble');b.onclick=()=>{say(en);const k=b.querySelector('.ko');k.style.display='block'};
  chat.appendChild(d);say(en);d.scrollIntoView({behavior:'smooth',block:'center'})}
 function addMe(en){const d=document.createElement('div');d.className='me pop';d.textContent=en;chat.appendChild(d)}
 function turn(){const t=turns[ti];addNpc(t[0],t[1]);
  const opts=shuffle(t[2].map((o,i)=>({en:o[0],ko:o[1],ok:i===0})));
  ctl.innerHTML=`<div class="hint" style="margin-top:6px">👇 어떻게 대답할까요? 고른 뒤 <b>소리 내어</b> 말해 보세요</div>`+opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.en)}${st.hintKo?`<small>${esc(o.ko)}</small>`:''}</button>`).join('');
  ctl.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];
   if(o.ok){ctl.innerHTML='';addMe(o.en);say(o.en,{pitch:1,end:()=>{
     const g=rnd(n.good);setTimeout(()=>{addNpc(g[0],g[1]);ti++;setTimeout(()=>ti<turns.length?turn():done(),1600)},300)}});
    }else{miss++;b.classList.add('wrong');b.disabled=true;addMe(o.en);
     const h=rnd(n.huh);setTimeout(()=>addNpc(h[0],h[1],'wrongb'),500)}
  })}
 function done(){st.role[cid]=(st.role[cid]||0)+1;const bonus=miss===0?40:25;st.xp+=bonus;save();
  const e=rnd(n.end);
  ctl.innerHTML=`<div class="card center pop"><div style="font-size:56px">${miss===0?'🏆':'🎉'}</div><b>대화 성공!</b><div class="hint">${miss===0?'한 번도 안 틀렸어요! ':''}+${bonus}점</div></div>
  <button class="btn" id="again">🔁 같은 상황 다시</button><button class="btn sec" id="other">다른 장소 고르기</button>`;
  confetti();setTimeout(()=>addNpc(e[0],e[1]),200);
  $('#again').onclick=()=>rolePlay(cid);$('#other').onclick=roleList}
 turn();
}

// ===================== 소리 도움말 =====================
function soundHelp(){
 app.innerHTML=`<div class="top"><button class="x" id="bk">←</button><h2 style="margin:0">🔈 소리 점검</h2></div>
 <button class="btn blue" id="t1">🔊 소리 시험하기</button>
 <div id="tr"></div>
 <div class="card"><b>소리가 안 나면 차례대로 확인해 주세요</b>
 <ol style="padding-left:22px;margin:8px 0">
 <li><b>아이폰 무음 모드 끄기</b><br><span class="hint">옆면 무음 스위치(또는 액션 버튼)를 꺼 주세요. 무음이면 소리가 안 나요.</span></li>
 <li><b>볼륨 올리기</b><br><span class="hint">옆면 볼륨 버튼(+)을 여러 번 눌러 주세요.</span></li>
 <li><b>카톡 안에서 열었다면</b><br><span class="hint">⋯ → <b>다른 브라우저로 열기</b>로 Safari·크롬에서 열어 주세요.</span></li>
 <li><b>화면을 한 번 눌러 주세요</b><br><span class="hint">휴대폰은 화면을 한 번 누른 뒤부터 소리가 나요.</span></li>
 <li><b>그래도 안 되면 (안드로이드)</b><br><span class="hint">설정 → '텍스트 음성 변환(TTS)' → Google 음성 엔진 설치·영어 음성 다운로드</span></li>
 </ol></div>
 <div class="card hint">이 브라우저 음성 기능: ${HAS_TTS?'✅ 있음':'❌ 없음 (다른 브라우저로 열어 주세요)'} · 영어 목소리: ${voice?esc(voice.name):'기본'}</div>`;
 $('#bk').onclick=home;
 $('#t1').onclick=()=>{unlock();say('Hello! Can you hear me?',{pitch:1});$('#tr').innerHTML=`<div class="card center">들리셨나요?<div class="row" style="margin-top:8px"><button class="btn ok" id="ye">👍 들려요</button><button class="btn sec" id="no">👎 안 들려요</button></div></div>`;
  $('#ye').onclick=home;$('#no').onclick=()=>{$('#tr').innerHTML='<div class="fb bad">아래 순서대로 하나씩 확인해 주세요 👇 (특히 1번 무음 모드!)</div>'}};
}

// ===================== 공지 · 업데이트 내역 =====================
function latestPackBtn(){const p=PACKS[PACKS.length-1];if(!p||PACKS.length<2)return '';
 const left=ALL.filter(x=>x.pack===p.id&&!st.cards[x.id]).length;if(!left)return '';
 return `<button class="btn" id="np" data-p="${p.id}" style="background:#9b5cff">🆕 이번 주 새 문장 배우기<br><span style="font-size:16px;font-weight:400">${esc(p.title)} · 남은 ${left}문장</span></button>`}
function showNotice(force){const m=MANIFEST;if(!m||!m.notice)return;if(!force&&st.seenNotice===m.notice.id)return;
 const d=document.createElement('div');d.id='ntc';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:18px';
 d.innerHTML=`<div class="card pop" style="max-width:480px;width:100%;max-height:85vh;overflow:auto"><span class="tag">📢 새 소식 · v${esc(m.version)}</span>
 <h2>${esc(m.notice.title)}</h2>${(m.notice.body||[]).map(b=>`<p style="margin:6px 0">${esc(b)}</p>`).join('')}
 <button class="btn" id="nok">확인했어요 👍</button><div class="center hint" id="nhis" style="cursor:pointer">전체 업데이트 내역 보기</div></div>`;
 document.body.appendChild(d);const close=()=>{st.seenNotice=m.notice.id;save();d.remove()};
 d.querySelector('#nok').onclick=close;d.querySelector('#nhis').onclick=()=>{close();showHistory()}}
function showHistory(){const m=MANIFEST||{history:[]};if(m.notice){st.seenNotice=m.notice.id;save()}
 app.innerHTML=`<div class="top"><button class="x" id="bk">←</button><h2 style="margin:0">📢 공지·업데이트 내역</h2></div>
 ${m.notice?`<div class="card"><span class="tag">최신 공지</span><h2>${esc(m.notice.title)}</h2>${(m.notice.body||[]).map(b=>`<p style="margin:6px 0">${esc(b)}</p>`).join('')}</div>`:''}
 <div class="stats"><div class="stat"><b>v${esc(m.version||'-')}</b><span>현재 버전</span></div><div class="stat"><b>${PACKS.length}주차</b><span>문장 묶음</span></div><div class="stat"><b>${ALL.length}</b><span>전체 문장</span></div></div>
 <div class="card"><b>버전 기록</b> <span class="hint">(총 ${(m.history||[]).length}회 업데이트)</span>${(m.history||[]).map((h,i)=>`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px"><b>v${esc(h.version)}</b>${i===0?' <span class="tag">현재</span>':''} <span class="hint">${esc(h.date)}</span><div>${esc(h.title||'')}</div><ul style="margin:4px 0;padding-left:20px;font-size:17px">${(h.changes||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`).join('')}</div>
 <div class="card hint">📅 매주 월요일 아침에 새 문장 100개가 추가돼요!</div>`;
 $('#bk').onclick=home}

// ===================== 설정 =====================
function settings(){
 let resetArm=false;
 const draw=()=>{
 app.innerHTML=`<div class="top"><button class="x" id="bk">←</button><h2 style="margin:0">⚙️ 설정</h2></div>
 <div class="card"><b>대화 상대 고르기</b><div class="hint">칭찬·위로·상황극 상대역을 맡아요. 누르면 목소리를 들어볼 수 있어요.</div>
 ${Object.entries(NPCS).map(([k,v])=>`<div class="npcpick ${st.npc===k?'sel':''}" data-n="${k}"><div class="ava">${v.ava}</div><div><b>${v.name}</b>${st.npc===k?' ✅':''}<div class="hint">${v.desc}</div></div></div>`).join('')}</div>
 <div class="card"><b>말하기 속도</b><div class="seg" style="margin-top:8px">${[[0.6,'🐢 아주 천천히'],[0.8,'🚶 천천히'],[1,'🏃 보통']].map(([r,l])=>`<button data-r="${r}" class="${st.rate==r?'sel':''}">${l}</button>`).join('')}</div></div>
 <div class="card"><b>상황극 한글 뜻 보기</b><div class="hint">익숙해지면 꺼서 영어만 듣고 도전해 보세요!</div><div class="seg" style="margin-top:8px"><button data-h="1" class="${st.hintKo?'sel':''}">보이기</button><button data-h="0" class="${!st.hintKo?'sel':''}">숨기기 (도전!)</button></div></div>
 <div class="card"><b>앱 정보</b><div class="hint">버전 v${MANIFEST?esc(MANIFEST.version):'-'} · 업데이트 ${MANIFEST?esc(MANIFEST.updated):'-'} · 문장 ${ALL.length}개</div><button class="btn sec" id="vh">📢 업데이트 내역 보기</button></div>
 <div class="card"><b>처음부터 다시</b><div class="hint">모든 진도와 도장이 지워져요.</div><button class="btn sec" id="rs" style="color:var(--bad)">${resetArm?'정말 지울까요? 한 번 더 누르면 삭제':'🗑️ 기록 초기화'}</button></div>`;
 $('#bk').onclick=home;$('#vh').onclick=showHistory;
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.npc=b.dataset.n;save();draw();npcSay(rnd(npc().hi))});
 app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{st.rate=+b.dataset.r;save();draw();say('Hello! Nice to meet you.',{pitch:1})});
 app.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{st.hintKo=b.dataset.h==='1';save();draw()});
 $('#rs').onclick=()=>{if(!resetArm){resetArm=true;draw();return}try{localStorage.removeItem(KEY)}catch(e){}load();home()};
 };draw();
}

async function init(){
 try{const r=await fetch('manifest.json?t='+Date.now(),{cache:'no-store'});MANIFEST=await r.json();
  for(const f of MANIFEST.packs){try{const p=await (await fetch('packs/'+f+'?v='+MANIFEST.version)).json();mergePack(p)}catch(e){console.log('pack fail',f,e)}}
 }catch(e){console.log('manifest fail',e)}
 if(!CATS.length){app.innerHTML='<div class="card center" style="margin-top:40px"><div style="font-size:50px">📶</div><h2>문장을 불러오지 못했어요</h2><p>인터넷 연결을 확인하고<br>새로고침해 주세요.</p><button class="btn" onclick="location.reload()">🔄 다시 시도</button></div>';return}
 buildAll();home();showNotice(false)}
init().catch(e=>{app.innerHTML='<div class="card">앗, 오류가 났어요: '+esc(e.message)+'<br>Safari나 크롬으로 열어 주세요.</div>'});
</script>
</body>
</html>
